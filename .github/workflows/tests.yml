# Host tests, arduino-lint, example builds, format and brand-lint on every push and PR, plus the
# release-card check on a prepare commit. The workflow ref and tools_ref name the same tools tag.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-core-tests.yml@3.1.2
    with:
      tools_ref: "3.1.2"
