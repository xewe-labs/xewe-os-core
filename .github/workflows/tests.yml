# tests.yml: host unit tests, arduino-lint, example builds, format and brand-lint for every push and PR.
# Nothing here publishes: releases are made with scripts/release.sh (un-prefixed X.Y.Z tags).
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-core-tests.yml@main
